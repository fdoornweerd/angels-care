# A desktop app: no web server, and no banner in the start-up output.
spring.main.web-application-type=none
spring.main.banner-mode=off

# angelscare.data-dir is not set here: Bootstrap passes it in, so it always matches the folder the
# start-up log and the native SQLite library use.

# Databases created before Flyway was added (the Mac and the Windows PC both have one) have tables
# but no flyway_schema_history, which Flyway otherwise refuses to touch. Baselining them at version 0
# means V1 onwards still runs on them. Has no effect on a fresh or already-migrated database.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
