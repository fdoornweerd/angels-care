name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      # One broken variant must not stop the others from producing a downloadable build.
      fail-fast: false
      matrix:
        include:
          # Unzip-and-run. No installer, no admin rights, nothing to go wrong at install time.
          - variant: portable
            task: jlinkZip
          # Same, but from an unstripped runtime image with --bind-services.
          - variant: portable-nostrip
            task: jlinkZip
          # .exe installer that installs per-user and actually creates shortcuts.
          - variant: installer
            task: jpackage
          # Same installer, but the app runs with a console window so errors stay on screen.
          - variant: installer-console
            task: jpackage

    name: ${{ matrix.variant }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build ${{ matrix.variant }}
        run: ./gradlew ${{ matrix.task }} -PpackagingVariant=${{ matrix.variant }} --stacktrace

      - name: Upload ${{ matrix.variant }}
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: angels-care-${{ matrix.variant }}
          if-no-files-found: error
          path: |
            app/build/distributions/AngelsCare-${{ matrix.variant }}.zip
            app/build/jpackage/*.exe
            app/build/jpackage/AngelsCare/**
