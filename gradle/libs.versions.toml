[versions]
spring-boot = "4.1.1"
sqlite-jdbc = "3.53.4.0"
javafx = "21.0.12"

[libraries]
# Spring Boot's BOM pins versions for everything below that has no version of its own
# (Spring, Flyway, Hikari, JUnit, AssertJ). Imported as a platform rather than via the Spring Boot
# Gradle plugin, whose fat-jar packaging is not what jpackage needs.
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }

[plugins]
javafx = { id = "org.openjfx.javafxplugin", version = "0.1.0" }
runtime = { id = "org.beryx.runtime", version = "2.0.1" }
